[project]
name = "geo-data-normalize"
version = "0.1.0"
description = "Downloads and normalizes administrative boundary data (INSEE, geoBoundaries, geonames)."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "shapely>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["scripts/tests"]
