version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    # Bump uv.lock only: pyproject.toml keeps lower bounds, not the latest version
    versioning-strategy: lockfile-only
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
